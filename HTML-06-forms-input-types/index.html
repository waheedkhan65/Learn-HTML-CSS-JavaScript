<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms and Input Types Concept</title>
</head>
<body>
    <form>
        <label>Name:</label>
        <input type="text">

        <label>Email:</label>
        <input type="email">

        <label>Password:</label>
        <input type="password">

        <label>Age:</label>
        <input type="number">

        <label>Birthday:</label>
        <input type="date">

        <input type="submit" value="Submit">
    </form>
</body>
</html>
