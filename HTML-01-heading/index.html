<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Heading Concept</title>
</head>
<body>
     <h1>Heading Example</h1> <!-- This is the main heading of the page, typically used for the title or main topic. -->
    <h2>Subheading Example</h2>  <!-- This is a subheading, used to introduce sections or subsections of content. -->
    <h3>Small Heading Example</h3> <!-- This is a smaller heading, used for sub-subsections or detailed points. --> 
</body>
</html>
